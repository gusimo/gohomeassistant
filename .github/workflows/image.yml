# Builds the app image for each architecture and publishes it to ghcr.io as
# ghcr.io/gusimo/<arch>-gohomeassistant:<version>, the image named in
# addon/config.yaml. Runs when the app version changes (or manually).
name: Image

on:
  push:
    branches: [main]
    paths: [addon/config.yaml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm # native, no emulation
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: |
          v=$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\}/\1/p' addon/config.yaml)
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/gusimo/${{ matrix.arch }}-gohomeassistant:${{ steps.v.outputs.version }}
            ghcr.io/gusimo/${{ matrix.arch }}-gohomeassistant:latest
          labels: |
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-only
